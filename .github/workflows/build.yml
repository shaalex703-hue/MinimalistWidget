name: iOS Build (MinimalistWidget)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Widget & App on Apple macOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build MinimalistApp for Simulator
        run: |
          xcodebuild clean build \
            -project MinimalistWidget.xcodeproj \
            -scheme MinimalistApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO

      - name: Build MinimalistApp for iPhone Device
        run: |
          xcodebuild build \
            -project MinimalistWidget.xcodeproj \
            -scheme MinimalistApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Builds and IPA
        run: |
          mkdir -p output
          cd build_sim/Build/Products/Debug-iphonesimulator
          zip -r ../../../../output/MinimalistApp-Simulator.zip MinimalistApp.app
          cd ../../../..
          
          mkdir -p output/Payload
          cp -r build_device/Build/Products/Debug-iphoneos/MinimalistApp.app output/Payload/
          cd output
          zip -r MinimalistApp.ipa Payload
          rm -rf Payload
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalistApp-iOS-Build
          path: |
            output/MinimalistApp.ipa
            output/MinimalistApp-Simulator.zip
          retention-days: 14
